<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bruv social card</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { width: 1200px; height: 630px; overflow: hidden; display: grid; grid-template-columns: 1fr 1.15fr; gap: 40px; align-items: center; padding: 56px; }
      img { height: 46px; margin-bottom: 34px; }
      h1 { font-size: 60px; margin: 0 0 18px; }
      p { margin: 0; color: #cfcfcf; font-size: 23px; line-height: 1.45; }
      .term-body { font-size: 15px; min-height: 0; }
      .receipt { border: 1px solid #c792ea; border-radius: 4px; padding: 8px 14px; display: inline-block; }
    </style>
  </head>
  <body>
    <div>
      <img src="assets/bruv-wordmark-light.svg" alt="bruv" />
      <h1>Done means<br />checked.</h1>
      <p>GPT-6 Astra keeps going until the job is finished. A fresh agent checks it. You get a receipt.</p>
    </div>
    <figure class="term">
      <div class="term-bar"><span></span><span></span><span></span><b>~/app</b></div>
      <div class="term-body"><div class="ln"><span class="bad">✗ Check found 2 gaps</span></div><div class="ln">- Settings save lost on navigation</div><div class="ln">- Live API changes not verified</div><div class="ln dim">Fixing, then checking again.</div><div class="ln"> </div><div class="receipt"><div class="ln">Done · 38m · 300 calls · 5 agents</div><div class="ln"><span class="ok">✓</span> 62 browser tests pass</div><div class="ln"><span class="ok">✓</span> live signup, settings, comments</div><div class="ln">Changed: 47 files, +3558 −520</div></div></div>
    </figure>
  </body>
</html>
