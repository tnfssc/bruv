version: 2
updates:
  - package-ecosystem: bun
    directory: /
    target-branch: develop
    schedule:
      interval: daily
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      root-bun-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "test(deps)"
