name: Fixture CI (not product validation)

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Only dependency files may change in the test PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/changed-files
          cat /tmp/changed-files
          test "$(wc -l < /tmp/changed-files)" -eq 2
          grep -qx 'package.json' /tmp/changed-files
          grep -qx 'bun.lock' /tmp/changed-files
      - run: bun install --frozen-lockfile
      - run: bun test ./tests
      - name: Installation must not rewrite manifest or lock
        run: git diff --exit-code -- package.json bun.lock
