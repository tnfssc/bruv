<script>
  // The manifest holds the page's key, so the installed app opens signed in; it is served only with the key.
  {
    const key = new URLSearchParams(location.search).get("t");
    if (key) {
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = `/manifest.webmanifest?t=${encodeURIComponent(key)}`;
      document.head.append(link);
    }
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
</script>
