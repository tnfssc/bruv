name: CI
on:
  pull_request:
  push:
    branches: [develop]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run check
      - run: bun test
      - run: bun run test:site
