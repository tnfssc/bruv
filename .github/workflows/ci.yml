name: CI

on:
  push:
    branches: [develop]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  feedback:
    permissions:
      contents: read
      actions: read
    name: Docs-only feedback (not executable validation)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Resolve complete comparison
        id: comparison
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=""
          if [[ "$EVENT" == pull_request ]]; then
            # Compare the tested merge tree to its actual target parent, not a stale
            # payload base or a head-only merge-base diff. Invalid topology is full.
            if [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]] &&
               [[ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]] &&
               [[ "$(git rev-parse HEAD^2)" == "$PR_HEAD" ]]; then
              candidate=$(git rev-parse HEAD^1)
              if tree=$(git merge-tree --write-tree "$candidate" "$PR_HEAD") &&
                 [[ "$tree" == "$(git rev-parse HEAD^{tree})" ]]; then
                base="$candidate"
              fi
            fi
          elif [[ "$EVENT" == push ]]; then
            # Carry all changes since successful trusted CI, not just this push.
            # No baseline (including API uncertainty) deliberately plans full.
            base=$(bun scripts/find-ci-baseline.ts)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Plan validation
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.comparison.outputs.base }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch ]]; then
            printf 'mode=full\nfull=true\n' >> "$GITHUB_OUTPUT"
            echo 'Full reconciliation requested.' >> "$GITHUB_STEP_SUMMARY"
          else
            bun scripts/ci-selective.ts --base "$BASE"
          fi
      - name: Run docs classifier checks
        if: ${{ steps.plan.outputs.full == 'false' && (steps.plan.outputs.mode == 'docs') }}
        shell: bash
        env:
          BASE: ${{ steps.comparison.outputs.base }}
        run: bun scripts/ci-selective.ts --base "$BASE" --run

  test:
    name: Full validation / Linux x64
    needs: feedback
    if: ${{ needs.feedback.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Download-store caches below never restore node_modules, source, dist, or credentials.
      # Partial-key download hits are safe: frozen installs still run.
      - name: Configure package download stores
        shell: bash
        run: |
          echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bruv-bun-cache" >> "$GITHUB_ENV"
      - name: Cache Bun package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bruv-bun-cache
          key: bun-download-v2-1.4.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-download-v2-1.4.2-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Linux fixture package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bruv-apt-cache/*.deb
          key: ubuntu-24.04-apt-v1-${{ runner.arch }}-${{ hashFiles('scripts/install-ci-linux-tools.sh') }}
      - name: Install Linux test tooling
        shell: bash
        timeout-minutes: 5
        run: bash scripts/install-ci-linux-tools.sh --native-audio
      - name: Sanitized, device-free capture-origin tests
        shell: bash
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined native/live/AudioCore.c native/live/test-capture-gate.c -o /tmp/live-capture-gate-test
          /tmp/live-capture-gate-test
          clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined native/live-linux/tests/capture-gate.cpp -o /tmp/live-linux-capture-gate-test
          /tmp/live-linux-capture-gate-test
      - name: Capture-origin protocol in private Pulse fixture (no hardware)
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          pulse_pid=""
          cleanup() {
            status=$?
            if [[ $status != 0 && -f "$fixture/pulse.log" ]]; then cat "$fixture/pulse.log"; fi
            if [[ -n "$pulse_pid" ]]; then kill "$pulse_pid" 2>/dev/null || true; wait "$pulse_pid" 2>/dev/null || true; fi
            rm -rf "$fixture"
          }
          trap cleanup EXIT
          # Noble ships WebRTC 0.3, but the real helper requires the 1.x API.
          curl --fail --location https://freedesktop.org/software/pulseaudio/webrtc-audio-processing/webrtc-audio-processing-1.3.tar.gz -o "$fixture/apm.tar.gz"
          echo "95552fc17faa0202133707bbb3727e8c2cf64d4266fe31bfdb2298d769c1db75  $fixture/apm.tar.gz" | sha256sum --check
          tar -xzf "$fixture/apm.tar.gz" -C "$fixture"
          meson setup "$fixture/build" "$fixture/webrtc-audio-processing-1.3" --prefix="$fixture/apm" --libdir=lib --buildtype=release --wrap-mode=nofallback
          meson compile -C "$fixture/build" -j 2
          meson install -C "$fixture/build"
          export PKG_CONFIG_PATH="$fixture/apm/lib/pkgconfig"
          export LD_LIBRARY_PATH="$fixture/apm/lib"
          export CPLUS_INCLUDE_PATH="$fixture/apm/include"
          bash scripts/build-live-linux-helper.sh "$fixture/live-audio-linux"
          mkdir -m 700 "$fixture/home" "$fixture/runtime"
          head -c 256 /dev/urandom > "$fixture/cookie"
          export PULSE_SERVER="unix:$fixture/native" PULSE_COOKIE="$fixture/cookie"
          # -n disables the default startup script: no hardware discovery or default routes.
          cat > "$fixture/pulse.pa" <<EOF
          load-module module-native-protocol-unix socket=$fixture/native auth-cookie=$fixture/cookie
          load-module module-null-sink sink_name=bruv_ci_mic rate=16000 channels=1
          load-module module-null-sink sink_name=bruv_ci_out rate=48000 channels=1
          EOF
          HOME="$fixture/home" XDG_RUNTIME_DIR="$fixture/runtime" pulseaudio -nF "$fixture/pulse.pa" --daemonize=no --exit-idle-time=-1 --use-pid-file=no --log-target="file:$fixture/pulse.log" &
          pulse_pid=$!
          for i in {1..50}; do
            if timeout 2 pactl info >/dev/null 2>&1; then break; fi
            kill -0 "$pulse_pid"
            sleep .1
          done
          timeout 2 pactl info >/dev/null
          pactl -f json list sources | python3 -c 'import json,sys; assert {s["name"] for s in json.load(sys.stdin)} == {"bruv_ci_mic.monitor", "bruv_ci_out.monitor"}'
          python3 native/live-linux/tests/capture-protocol.py "$fixture/live-audio-linux" bruv_ci_mic.monitor bruv_ci_out
      - name: Shared Linux CI gate (paired binaries, external T3)
        shell: bash
        run: bun run ci
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-failure-logs
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14

  live-macos:
    name: Full validation / macOS Live (no devices or API)
    needs: feedback
    if: ${{ needs.feedback.outputs.full == 'true' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Configure package download stores
        shell: bash
        run: |
          echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bruv-bun-cache" >> "$GITHUB_ENV"
      - name: Cache Bun package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bruv-bun-cache
          key: bun-download-v2-1.4.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-download-v2-1.4.2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install required PTY tooling
        run: |
          command -v tmux >/dev/null || brew install tmux
          tmux -V
      - name: Install required audio fixture tooling
        shell: bash
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ffmpeg -version
      - name: Sanitized, device-free capture-origin tests
        shell: bash
        run: |
          xcrun clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined native/live/AudioCore.c native/live/test-capture-gate.c -o /tmp/live-capture-gate-test
          /tmp/live-capture-gate-test
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined native/live-linux/tests/capture-gate.cpp -o /tmp/live-linux-capture-gate-test
          /tmp/live-linux-capture-gate-test
      - name: Compile native helper and check exact capability (no devices)
        shell: bash
        run: |
          sh scripts/build-live-helper.sh
          python3 - <<'PY'
          import json, select, subprocess
          p = subprocess.Popen(['dist/live-audio'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          try:
              assert select.select([p.stdout], [], [], 5)[0], 'helper hello timed out'
              assert json.loads(p.stdout.readline()) == {'type': 'hello', 'protocol': 1, 'captureGate': True}
          finally:
              p.terminate()
              p.wait(timeout=5)
          PY
      # Source-only probe and fake Live tests; does not replace Linux build checks.
      - name: Shared macOS Live gate
        shell: bash
        run: bun run ci:macos

  required:
    name: CI policy
    needs: [feedback, test, live-macos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the planned validation outcomes
        shell: bash
        env:
          FEEDBACK: ${{ needs.feedback.result }}
          MODE: ${{ needs.feedback.outputs.mode }}
          FULL: ${{ needs.feedback.outputs.full }}
          LINUX: ${{ needs.test.result }}
          MACOS: ${{ needs.live-macos.result }}
        run: |
          set -euo pipefail
          if [[ "$FEEDBACK" != success ]]; then
            printf 'Planning or docs checks did not succeed: %s\n' "$FEEDBACK" >&2
            exit 1
          fi
          # The only accepted combinations are plan mode/full + Linux/macOS results.
          case "$MODE:$FULL:$LINUX:$MACOS" in
            full:true:success:success) ;;
            docs:false:skipped:skipped) ;;
            *)
              printf 'Rejected CI plan/results: mode=%s full=%s Linux=%s macOS=%s\n' \
                "$MODE" "$FULL" "$LINUX" "$MACOS" >&2
              exit 1
              ;;
          esac
