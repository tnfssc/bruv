name: Daily dependency PR

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      fixture:
        description: "TEST ONLY: update resolve.exports in the isolated private fixture repository"
        type: boolean
        default: false

concurrency:
  group: daily-dependency-pr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      base: ${{ steps.candidate.outputs.base }}
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.27.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install required PTY tooling
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Find and apply root dependency updates
        env:
          FIXTURE: ${{ inputs.fixture || false }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/dependency-update
          args=()
          if [[ "$FIXTURE" == true ]]; then args+=(--fixture); fi
          bun scripts/update-dependencies.ts "${args[@]}" 2>&1 | tee artifacts/dependency-update/update.log
      - name: Commit candidate before validation
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- package.json bun.lock; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No dependency changes; no PR will be created.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --mixed HEAD
          git add package.json bun.lock
          git commit -m 'chore(deps): update root Bun dependencies'
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate actual candidate with shared Linux CI
        run: bun run ci
      - name: Generate third-party notices from candidate
        shell: bash
        run: |
          set -euo pipefail
          bun run generate:notices 2>&1 | tee artifacts/dependency-update/notices.log
          git diff HEAD --exit-code
      - name: Package validated commit and review body
        if: steps.candidate.outputs.changed == 'true'
        env:
          BASE: ${{ steps.candidate.outputs.base }}
          SHA: ${{ steps.candidate.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FIXTURE: ${{ inputs.fixture || false }}
        shell: bash
        run: |
          set -euo pipefail
          git bundle create artifacts/dependency-update/candidate.bundle HEAD "^$BASE"
          {
            if [[ "$FIXTURE" == true ]]; then echo '# TEST ONLY — isolated fixture update'; fi
            cat artifacts/dependency-update/versions.md
            printf '\n## Validation\n\n- Exact candidate: %s\n- Base develop: %s\n- [Updater run and check logs](%s)\n' "$SHA" "$BASE" "$RUN_URL"
            echo '- Passed shared Linux CI: frozen install, format, lint, typecheck, build, web tests, deterministic tests, smoke; third-party notices generated.'
            echo '- GITHUB_TOKEN-created PRs do not trigger ordinary PR CI. The updater validated the exact commit above; no separate PR or macOS CI pass is claimed. Required PR checks may still need a human-authorized run.'
            echo '- Review breaking changes and lockfile before merging. No automatic merge or release.'
          } > artifacts/dependency-update/body.md
          cat artifacts/dependency-update/body.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save bounded recovery patch and logs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/dependency-update/logs
          git diff origin/develop --binary -- package.json bun.lock > artifacts/dependency-update/candidate.patch
          for log in artifacts/ci/*.log artifacts/dependency-update/*.log; do
            [[ -f "$log" ]] || continue
            tail -c 1048576 "$log" > "artifacts/dependency-update/logs/$(basename "$log")"
          done
          rm -f artifacts/dependency-update/*.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-candidate
          path: artifacts/dependency-update/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # Never install or execute candidate dependencies in the write-token job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-candidate
          path: candidate
      - name: Publish one bot branch and PR against develop
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.validate.outputs.base }}
          SHA: ${{ needs.validate.outputs.sha }}
          FIXTURE: ${{ inputs.fixture || false }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          current=$(git ls-remote origin refs/heads/develop | cut -f1)
          [[ "$current" == "$BASE" ]] || { echo 'develop moved during validation; rerun instead of publishing stale results'; exit 1; }
          git bundle verify candidate/candidate.bundle
          git fetch candidate/candidate.bundle HEAD
          [[ "$(git rev-parse FETCH_HEAD)" == "$SHA" ]]
          [[ "$(git rev-parse "$SHA^")" == "$BASE" ]]
          while IFS= read -r file; do
            case "$file" in package.json|bun.lock) ;; *) echo "Unexpected candidate file: $file"; exit 1 ;; esac
          done < <(git diff --name-only "$BASE" "$SHA")
          branch=automation/daily-dependencies
          previous=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          git push --force-with-lease="refs/heads/$branch:$previous" origin "$SHA:refs/heads/$branch"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f context='dependency-update/Linux validation' \
            -f description='Shared Linux CI and notices passed for this exact commit' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          title='chore(deps): update root Bun dependencies'
          if [[ "$FIXTURE" == true ]]; then title='test(deps): isolated fixture update (not production)'; fi
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base develop --state open --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file candidate/body.md
            gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head "$branch" --title "$title" --body-file candidate/body.md | tee -a "$GITHUB_STEP_SUMMARY"
          fi
