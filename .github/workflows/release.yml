name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Serialize manual requests; tag creation additionally checks the remote ref atomically.
concurrency:
  group: release-manual-${{ github.event_name == 'workflow_dispatch' && 'develop' || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare-manual:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - id: prepare
        name: Prepare next release on latest develop
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha=$(git rev-parse HEAD:.github/workflows/release.yml)
          git fetch origin develop --tags
          git checkout -B release origin/develop
          test "$(git rev-parse HEAD:.github/workflows/release.yml)" = "$workflow_sha" || { echo "Release workflow changed since dispatch; retry from latest develop"; exit 1; }
          tag=$(bun scripts/prepare-manual-release.ts)
          git add package.json "support/release-$tag.md"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Prepare $tag release"
            git push origin HEAD:refs/heads/develop
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Prepared $tag at $(git rev-parse HEAD); publication waits for all release gates." >> "$GITHUB_STEP_SUMMARY"

  release-source:
    name: Select admitted release source
    needs: prepare-manual
    # Tag pushes skip manual preparation; always() lets them reach this single admission check.
    if: >-
      ${{ always() && (
        (github.event_name == 'workflow_dispatch' && needs.prepare-manual.result == 'success') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))
      ) }}
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - id: source
        name: Pin source and tag for every release job
        env:
          RELEASE_SHA: ${{ needs.prepare-manual.outputs.sha || github.sha }}
          RELEASE_TAG: ${{ needs.prepare-manual.outputs.tag || github.ref_name }}
        run: |
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  mac-helper:
    name: Native macOS arm64 helper (no devices)
    runs-on: macos-15
    timeout-minutes: 10
    needs: release-source
    if: ${{ always() && needs.release-source.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-source.outputs.sha }}
      - name: Sanitized, device-free native ring tests
        shell: bash
        run: |
          xcrun clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined native/live/AudioCore.c native/live/test-core.c -o /tmp/live-core-test
          /tmp/live-core-test
          xcrun clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined native/live/AudioCore.c native/live/test-capture-gate.c -o /tmp/live-capture-gate-test
          /tmp/live-capture-gate-test
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined native/live-linux/tests/capture-gate.cpp -o /tmp/live-linux-capture-gate-test
          /tmp/live-linux-capture-gate-test
      - name: Compile helper and check device-free protocol
        shell: bash
        run: |
          scripts/build-live-helper.sh
          file dist/live-audio | grep -E 'Mach-O 64-bit (executable arm64|arm64 executable)'
          dist/live-audio --self-test
          python3 - <<'PY'
          import json, select, subprocess
          p = subprocess.Popen(['dist/live-audio'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          try:
              assert select.select([p.stdout], [], [], 5)[0], 'helper hello timed out'
              assert json.loads(p.stdout.readline()) == {'type': 'hello', 'protocol': 1, 'captureGate': True}
          finally:
              p.terminate()
              p.wait(timeout=5)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-mac-arm64-helper
          path: dist/live-audio
          if-no-files-found: error
          retention-days: 2
  release:
    needs: [release-source, mac-helper]
    if: ${{ always() && needs.release-source.result == 'success' && needs.mac-helper.result == 'success' }}
    name: Linux, macOS, and Android release
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    env:
      RELEASE_SHA: ${{ needs.release-source.outputs.sha }}
      RELEASE_TAG: ${{ needs.release-source.outputs.tag }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Download cache only: never restore node_modules, dist or credentials.
      # Partial-key download hits are safe: frozen installs still run.
      - name: Configure package download stores
        shell: bash
        run: |
          echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bruv-bun-cache" >> "$GITHUB_ENV"
      - name: Cache Bun package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bruv-bun-cache
          key: bun-download-v2-1.4.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-download-v2-1.4.2-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Linux fixture package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bruv-apt-cache/*.deb
          key: ubuntu-24.04-apt-v1-${{ runner.arch }}-${{ hashFiles('scripts/install-ci-linux-tools.sh') }}
      - name: Install Linux test tooling
        shell: bash
        timeout-minutes: 5
        run: bash scripts/install-ci-linux-tools.sh
      - name: Prepare logs
        run: mkdir -p artifacts/release dist/release
      - name: Validate tag matches package version
        shell: bash
        run: |
          bun scripts/validate-release-tag.ts "$RELEASE_TAG" 2>&1 | tee artifacts/release/version.log
      - name: Sanitized, device-free capture-origin tests
        shell: bash
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined native/live/AudioCore.c native/live/test-capture-gate.c -o /tmp/live-capture-gate-test
          /tmp/live-capture-gate-test
          clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined native/live-linux/tests/capture-gate.cpp -o /tmp/live-linux-capture-gate-test
          /tmp/live-linux-capture-gate-test
      - name: Find successful full CI for the exact release SHA
        id: ci-evidence
        shell: bash
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/find-release-ci.ts
      - name: Install locked dependencies after CI reuse
        if: ${{ steps.ci-evidence.outputs.reused == 'true' }}
        shell: bash
        run: bun install --frozen-lockfile
      - name: Shared ordinary Linux gate
        if: ${{ steps.ci-evidence.outputs.reused != 'true' }}
        timeout-minutes: 6
        shell: bash
        env:
          CI_LOG_DIR: artifacts/release/ci
        run: bun run ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-mac-arm64-helper
          path: artifacts/release/mac-helper
      - name: Verify native helper from Mac runner
        shell: bash
        run: |
          test -s artifacts/release/mac-helper/live-audio
          file artifacts/release/mac-helper/live-audio | grep -E 'Mach-O 64-bit (executable arm64|arm64 executable)'
      - name: Build one binary and thin connector launcher per target without bundled T3
        shell: bash
        run: |
          bun run build -- --target=bun-linux-x64-baseline --outfile=./dist/release/bruv-linux-x64 2>&1 | tee artifacts/release/build-linux-x64.log
          test "$(./dist/release/bruv-linux-x64 --version)" = "$(bun -p 'require("./package.json").version')"
          bun run build -- --target=bun-linux-arm64 --outfile=./dist/release/bruv-linux-arm64 2>&1 | tee artifacts/release/build-linux-arm64.log
          bun run build -- --live-helper=./artifacts/release/mac-helper/live-audio --target=bun-darwin-arm64 --outfile=./dist/release/bruv-darwin-arm64 2>&1 | tee artifacts/release/build-darwin-arm64.log
          bun run build -- --target=bun-android-arm64 --outfile=./dist/release/bruv-android-arm64 2>&1 | tee artifacts/release/build-android-arm64.log
          chmod 0755 ./dist/release/bruv-linux-x64 ./dist/release/bruv-linux-arm64 ./dist/release/bruv-darwin-arm64 ./dist/release/bruv-android-arm64
      - name: Generate production dependency notices
        shell: bash
        run: bun run generate:notices 2>&1 | tee artifacts/release/notices.log
      - name: Document native audio licensing
        shell: bash
        run: |
          printf '\n\nNATIVE LIVE AUDIO HELPER\n============================\n' >> dist/release/THIRD_PARTY_LICENSES.txt
          printf 'The native helper is project source under the repository MIT LICENSE; it links Apple system AVFoundation/CoreFoundation frameworks, not bundled third-party native libraries.\n' >> dist/release/THIRD_PARTY_LICENSES.txt
      - name: Create checksums and source information
        shell: bash
        run: |
          cd dist/release
          for binary in bruv-{linux-x64,linux-arm64,darwin-arm64,android-arm64} bruv-claude-compat-{linux-x64,linux-arm64,darwin-arm64,android-arm64}; do
            sha256sum "$binary" > "$binary.sha256"
          done
          cp ../../LICENSE ../../THIRD_PARTY_NOTICES.md .
          printf 'Source: https://github.com/%s/tree/%s\nCommit: %s\nTag: %s\nPaired targets: bun-linux-x64-baseline, bun-linux-arm64, bun-darwin-arm64, bun-android-arm64.\nEach target ships one compiled bruv binary and a tiny POSIX exec launcher bruv-claude-compat with checksums. The launcher execs its matching sibling bruv claude-compat. Linux/macOS require /bin/sh; Android requires /system/bin/sh and Android API 28+ (/system/bin/linker64), not glibc.\nT3 Code is external, unmodified, manually installed and not included in these assets.\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_SHA" "$RELEASE_SHA" "$RELEASE_TAG" > SOURCE.txt
          printf '\nEmbedded macOS arm64 native helper (Apple frameworks; experimental voice-only /live):\n' >> SOURCE.txt
          sha256sum ../../artifacts/release/mac-helper/live-audio >> SOURCE.txt
      - name: Verify release launcher packaging and Android runtime target
        shell: bash
        run: |
          bun scripts/verify-release-launchers.ts dist/release
          readelf -l dist/release/bruv-android-arm64 | grep -F '/system/bin/linker64'
      - name: Verify bruv updater with actual Linux release binary
        run: |
          bun scripts/verify-update.ts dist/release/bruv-linux-x64 "$(bun -p 'require("./package.json").version')"
          bun scripts/verify-update.ts dist/release/bruv-linux-x64 "$(bun -p 'require("./package.json").version')" --legacy-updater
      - name: Stage verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-failure-logs
          path: artifacts/release/
          if-no-files-found: warn
          retention-days: 14

  linux-browser-boot:
    name: Final Linux pair against unchanged official 2644 (bounded gates)
    needs: [release, release-source]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-source.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-release-assets
          path: dist/release
      - name: Cache pinned Chromium harness downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-browser/chromium
          key: playwright-1.63.0-ubuntu24.04-headless-${{ runner.os }}-${{ runner.arch }}
      - name: Install isolated browser harness
        shell: bash
        run: bash scripts/setup-release-browser.sh
      - name: Download pinned official T3 for native gate (test dependency only)
        shell: bash
        run: bash scripts/setup-native-release-gate.sh
      - name: Require external unmodified T3 native acceptance from final Linux pair
        shell: bash
        run: |
          chmod 0755 dist/release/bruv-linux-x64
          chmod 0755 dist/release/bruv-claude-compat-linux-x64
          home=$(mktemp -d)
          trap 'rm -rf "$home"' EXIT
          version=$(HOME="$home" dist/release/bruv-linux-x64 --version)
          test "$version" = "$(bun -p 'require("./package.json").version')"
          test "$(HOME="$home" dist/release/bruv-claude-compat-linux-x64 --bruv-version)" = "bruv-claude-compat $version"
          test "$(HOME="$home" dist/release/bruv-claude-compat-linux-x64 --version)" = "Bruv connector"
          BRUV_CONNECTOR_EXECUTABLE="$GITHUB_WORKSPACE/dist/release/bruv-claude-compat-linux-x64" \
          BRUV_RUNTIME_BINARY="$GITHUB_WORKSPACE/dist/release/bruv-linux-x64" \
          PROOF_OUTPUT="$GITHUB_WORKSPACE/artifacts/release/native-acceptance" \
          node scripts/run-native-release-gate.mjs
      - name: Upload external native proof (including failures)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-browser-boot-proof
          path: artifacts/release/native-acceptance/
          if-no-files-found: warn
          retention-days: 7

  mac-release-smoke:
    name: Actual Mac release binary and bruv updater (no devices)
    needs: [release, release-source]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-source.outputs.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-release-assets
          path: dist/release
      - name: Exercise paired versions, bruv updater and embedded helper
        shell: bash
        run: |
          chmod 0755 dist/release/bruv-darwin-arm64 dist/release/bruv-claude-compat-darwin-arm64
          version="$(dist/release/bruv-darwin-arm64 --version)"
          test "$version" = "$(bun -p 'require("./package.json").version')"
          test "$(dist/release/bruv-claude-compat-darwin-arm64 --bruv-version)" = "bruv-claude-compat $version"
          test "$(dist/release/bruv-claude-compat-darwin-arm64 --version)" = "Bruv connector"
          bun scripts/verify-update.ts dist/release/bruv-darwin-arm64 "$(bun -p 'require("./package.json").version')"
          bun scripts/verify-update.ts dist/release/bruv-darwin-arm64 "$(bun -p 'require("./package.json").version')" --legacy-updater
          home=$(mktemp -d)
          trap 'rm -rf "$home"' EXIT
          cd "$home"
          env -i HOME="$home" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/release/bruv-darwin-arm64" --live-self-test

  publish:
    name: Publish stable release after browser, native and updater gates
    needs: [release, linux-browser-boot, mac-release-smoke, release-source]
    if: ${{ always() && needs.release-source.result == 'success' && needs.linux-browser-boot.result == 'success' && needs.mac-release-smoke.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      RELEASE_SHA: ${{ needs.release-source.outputs.sha }}
      RELEASE_TAG: ${{ needs.release-source.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-source.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-release-assets
          path: dist/release
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bun scripts/publish-release.ts
          echo "Published $RELEASE_TAG from $RELEASE_SHA with verified release assets." >> "$GITHUB_STEP_SUMMARY"
