name: Native Live
on:
  workflow_dispatch:
    inputs:
      realtime-transport-only:
        description: "Run only the device-free compiled Realtime transport probe"
        type: boolean
        default: false
  push:
    branches: [develop]
    paths:
      - "native/live/**"
      - "native/live-linux/**"
      - "scripts/build-live-helper.sh"
      - ".github/workflows/live.yml"
permissions:
  contents: read
jobs:
  macos-helper:
    if: ${{ !inputs.realtime-transport-only }}
    name: macOS native helper (no devices)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test bounded audio rings
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined native/live/AudioCore.c native/live/test-core.c -o /tmp/live-core-test
          /tmp/live-core-test
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined native/live/AudioCore.c native/live/test-capture-gate.c -o /tmp/live-capture-gate-test
          /tmp/live-capture-gate-test
          clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined native/live-linux/tests/capture-gate.cpp -o /tmp/live-linux-capture-gate-test
          /tmp/live-linux-capture-gate-test
      - name: Compile Apple voice-processing helper and self-test
        run: sh scripts/build-live-helper.sh
      - name: Device-free protocol smoke
        run: |
          dist/live-audio --help
          python3 - <<'PY'
          import json, select, subprocess
          p = subprocess.Popen(['dist/live-audio'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          try:
              assert select.select([p.stdout], [], [], 5)[0], 'helper hello timed out'
              assert json.loads(p.stdout.readline()) == {'type': 'hello', 'protocol': 1, 'captureGate': True}
          finally:
              p.terminate()
              p.wait(timeout=5)
          PY
          printf '{"type":"stop"}\n' | dist/live-audio
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-audio-macos-arm64
          path: dist/live-audio
          if-no-files-found: error
          retention-days: 7

  realtime-transport:
    if: ${{ inputs.realtime-transport-only }}
    name: macOS compiled Realtime transport (loopback only)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.27.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build full production CLI (no helper or devices)
        run: bun run build
      - name: Probe source and full compiled default transport
        run: bun scripts/offline-openai-default-transport.ts
