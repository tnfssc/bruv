version: 2
updates:
  - package-ecosystem: bun
    directory: /
    target-branch: develop
    schedule:
      interval: daily
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      root-bun-dependencies:
        patterns:
          - "*"
    # Pi is a checked SDK: exact package versions and source hash move together.
    # Upgrades require human-reviewed adapter migrations, not a blind version bump.
    ignore:
      - dependency-name: "@earendil-works/pi-*"
