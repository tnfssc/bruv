<style>
/* Design tokens and components follow shadcn/ui (zinc theme, new-york style); icons are Lucide (ISC). */
:root {
  --radius: 0.625rem;
  --background: oklch(1 0 0);
  --foreground: oklch(0.141 0.005 285.823);
  --card: oklch(1 0 0);
  --muted: oklch(0.967 0.001 286.375);
  --muted-foreground: oklch(0.552 0.016 285.938);
  --secondary: oklch(0.967 0.001 286.375);
  --primary: oklch(0.21 0.006 285.885);
  --primary-foreground: oklch(0.985 0 0);
  --raised: var(--background);
  --ring: oklch(0.705 0.015 286.067);
  --destructive: oklch(0.577 0.245 27.325);
  --listening: oklch(0.65 0.16 155);
  --hearing: oklch(0.62 0.19 255);
  --thinking: oklch(0.72 0.16 70);
  --speaking: oklch(0.6 0.22 295);
  --shadow: 0 1px 2px oklch(0 0 0 / 5%), 0 8px 24px -8px oklch(0 0 0 / 12%);
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: oklch(0.141 0.005 285.823);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.21 0.006 285.885);
    --muted: oklch(0.274 0.006 286.033);
    --muted-foreground: oklch(0.705 0.015 286.067);
    --secondary: oklch(0.274 0.006 286.033);
    --primary: oklch(0.92 0.004 286.32);
    --primary-foreground: oklch(0.21 0.006 285.885);
    --raised: oklch(1 0 0 / 8%);
    --ring: oklch(0.552 0.016 285.938);
    --destructive: oklch(0.704 0.191 22.216);
    --listening: oklch(0.77 0.15 160);
    --hearing: oklch(0.72 0.15 250);
    --thinking: oklch(0.83 0.14 80);
    --speaking: oklch(0.72 0.17 295);
    --shadow: 0 1px 2px oklch(0 0 0 / 30%), 0 12px 32px -12px oklch(0 0 0 / 60%);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--background); color: var(--foreground);
  font: 15px/1.5 "Geist", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  --tone: var(--muted-foreground);
}
body[data-tone="listening"] { --tone: var(--listening); }
body[data-tone="hearing"] { --tone: var(--hearing); }
body[data-tone="thinking"] { --tone: var(--thinking); }
body[data-tone="speaking"] { --tone: var(--speaking); }
body[data-tone="error"] { --tone: var(--destructive); }
/* A soft light under the controls, in the colour of what is happening. */
body::before {
  content: ""; position: fixed; inset: auto -20% -35vh; height: 70vh; pointer-events: none; z-index: 0;
  background: radial-gradient(closest-side, color-mix(in oklch, var(--tone) 22%, transparent), transparent);
  transition: background .6s ease;
}
button { font: inherit; color: inherit; }
.icon { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

header {
  position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  padding: calc(.75rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) .75rem max(1rem, env(safe-area-inset-left));
}
/* bruv's own wordmark and b, from site/assets/brand. */
.wordmark { display: block; height: 1.375rem; width: calc(1.375rem * 489 / 144); fill: currentColor; }
.end { display: flex; align-items: center; gap: .375rem; }
.ghost { display: grid; place-items: center; width: 2.25rem; height: 2.25rem; border: 0; border-radius: var(--radius); background: transparent; color: var(--muted-foreground); cursor: pointer; transition: background-color .15s, color .15s; }
.ghost:hover, .ghost[aria-expanded="true"] { background: var(--muted); color: var(--foreground); }
.status { display: flex; align-items: center; gap: .5rem; font-size: .8125rem; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; }
#label { min-width: 7rem; text-align: right; }
.dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--tone); transition: background .3s; }
body[data-tone="hearing"] .dot, body[data-tone="thinking"] .dot { animation: blink 1.2s ease-in-out infinite; }

main { position: relative; z-index: 1; flex: 1; overflow-y: auto; overscroll-behavior: contain; }
#log { display: flex; flex-direction: column; gap: 1.25rem; max-width: 42rem; margin: 0 auto; padding: 1rem max(1.25rem, env(safe-area-inset-left)) 2rem; min-height: 100%; }
.empty { margin: auto; text-align: center; max-width: 20rem; padding: 2rem 0; }
.empty .b { display: block; height: 3rem; width: calc(3rem * 125 / 144); margin: 0 auto 1.25rem; fill: currentColor; color: var(--tone); opacity: .9; transition: color .3s; }
.empty h1 { margin: 0; font-size: 1.125rem; font-weight: 500; letter-spacing: -0.02em; color: var(--muted-foreground); }
/* On a computer, a QR code opens the page on a phone, once the tunnel gives it an address a phone can use. */
.phone { display: none; flex-direction: column; align-items: center; gap: .5rem; font-size: .8125rem; color: var(--muted-foreground); }
.phone svg { display: block; width: 9rem; height: 9rem; border-radius: calc(var(--radius) - 2px); }
@media (hover: hover) and (pointer: fine) { .phone:not([hidden]) { display: flex; } }
.empty .phone { margin-top: 2rem; }
#menu .phone { padding: .5rem 0 .25rem; }
.msg { max-width: 100%; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; max-width: min(85%, 32rem); text-align: right; color: var(--muted-foreground); }
.msg.partial::after { content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 2px; margin-right: -4px; vertical-align: -0.15em; background: var(--hearing); animation: blink 1s steps(2) infinite; }
.msg.assistant { align-self: flex-start; font-size: 1.0625rem; line-height: 1.65; letter-spacing: -0.005em; }
.msg.assistant span { color: var(--muted-foreground); text-decoration: underline 2px transparent; text-underline-offset: .3em; transition: color .3s, text-decoration-color .3s; }
.msg.assistant span.said { color: var(--foreground); }
.msg.assistant span.now { color: var(--foreground); text-decoration-color: color-mix(in oklch, var(--speaking) 70%, transparent); }
.msg.assistant span.cut { text-decoration: line-through; text-decoration-color: color-mix(in oklch, var(--muted-foreground) 60%, transparent); opacity: .6; }
/* What the agent wrote or did: shown, never spoken. Long text is clamped; a tap opens it. */
.note { align-self: flex-start; max-width: 100%; overflow-wrap: anywhere; white-space: pre-wrap; color: var(--muted-foreground); font-size: .875rem; line-height: 1.55; opacity: .8; }
.note.text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; cursor: pointer; }
.note.text.open { display: block; }
.note.tool { font: .75rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alert { display: flex; gap: .625rem; align-items: flex-start; padding: .75rem 1rem; border-radius: var(--radius); background: color-mix(in oklch, var(--destructive) 8%, var(--card)); color: var(--destructive); font-size: .875rem; }
.alert .icon { width: 1rem; height: 1rem; margin-top: .15rem; }

footer { position: relative; z-index: 1; padding: .5rem max(.75rem, env(safe-area-inset-right)) calc(.75rem + env(safe-area-inset-bottom)) max(.75rem, env(safe-area-inset-left)); }
.dock {
  max-width: 17rem; margin: 0 auto;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
}
#mute { justify-self: start; margin-left: .5rem; }
#stop { justify-self: end; margin-right: .5rem; }
.btn {
  display: inline-grid; place-items: center; width: 3rem; height: 3rem; border-radius: .75rem; cursor: pointer;
  border: 0; background: transparent; color: var(--foreground);
  transition: background-color .15s, color .15s, opacity .15s;
}
.btn:hover:not(:disabled) { background: var(--muted); }
.btn:disabled { opacity: .4; cursor: default; }
.btn[aria-pressed="true"] { background: var(--muted); }
button:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }
.talk-wrap { position: relative; display: grid; place-items: center; width: 5.5rem; height: 5.5rem; }
.halo {
  position: absolute; inset: 0; border-radius: 1.5rem; pointer-events: none;
  background: color-mix(in oklch, var(--tone) 28%, transparent);
  transform: scale(calc(.82 + var(--level, 0) * .5)); opacity: calc(.35 + var(--level, 0) * 1.5);
  transition: background-color .3s, transform .08s linear;
}
body[data-tone="thinking"] .halo { animation: breathe 1.4s ease-in-out infinite; }
.talk {
  position: relative; display: grid; place-items: center; width: 4.5rem; height: 4.5rem; border-radius: 1.25rem;
  border: 0; cursor: pointer; background: var(--primary); color: var(--primary-foreground);
  box-shadow: 0 6px 20px -6px color-mix(in oklch, var(--foreground) 45%, transparent);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  transition: background-color .2s, color .2s;
}
.talk .icon { width: 1.75rem; height: 1.75rem; }
body[data-holding] .talk { background: var(--hearing); color: #fff; }

#size { display: none; }
#size[aria-pressed="true"] { background: transparent; }
/* Phones: big targets for the thumb. Big controls take the bottom half of the screen; small ones a row. */
@media (pointer: coarse) {
  footer { padding-top: .25rem; }
  .dock { max-width: 32rem; padding: 0; gap: .625rem; border: 0; background: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; grid-template-columns: 1fr 1fr 3.75rem; grid-template-areas: "mute stop size" "talk talk talk"; }
  #mute, #stop, #size { margin: 0; justify-self: stretch; }
  #mute { grid-area: mute; }
  #stop { grid-area: stop; }
  #size { display: inline-grid; grid-area: size; color: var(--muted-foreground); }
  .btn { width: 100%; height: 3.75rem; border-radius: var(--radius); }
  .btn .icon { width: 1.5rem; height: 1.5rem; }
  .talk-wrap { grid-area: talk; width: 100%; height: 8rem; }
  .halo { display: none; }
  .talk {
    width: 100%; height: 100%; border-radius: var(--radius);
    /* The voice level shows as a stronger fill, not a ring. */
    background: color-mix(in oklch, var(--tone) calc(12% + var(--level, 0) * 22%), var(--card)); color: var(--tone);
    box-shadow: none;
    transition: background-color .2s, color .2s;
  }
  .talk .icon { width: 2.75rem; height: 2.75rem; }
  body[data-tone="thinking"] .talk { animation: breathe 1.4s ease-in-out infinite; }
  body:not([data-small]) footer { display: flex; height: 50dvh; }
  body:not([data-small]) .dock { flex: 1; width: 100%; grid-template-rows: auto 1fr; }
  body:not([data-small]) .talk-wrap { height: 100%; }
  body[data-small] .dock { grid-template-columns: 3.75rem 1fr 3.75rem 3.75rem; grid-template-areas: "mute talk stop size"; }
  body[data-small] .talk-wrap { height: 3.75rem; }
  body[data-small] .talk .icon { width: 1.75rem; height: 1.75rem; }
}

#menu {
  margin: calc(3.25rem + env(safe-area-inset-top)) max(.75rem, env(safe-area-inset-right)) auto auto; padding: .5rem;
  width: min(17rem, calc(100vw - 1.5rem)); border: 0; border-radius: var(--radius);
  background: var(--card); color: var(--foreground); box-shadow: var(--shadow);
}
#menu[open] { display: flex; flex-direction: column; gap: .5rem; animation: fade .12s ease-out; }
dialog::backdrop { background: oklch(0 0 0 / 25%); }
.keys { display: none; flex-direction: column; gap: .25rem; padding: .25rem .5rem; font-size: .8125rem; color: var(--muted-foreground); }
.keys > * { display: flex; justify-content: space-between; }
@media (hover: hover) and (pointer: fine) { .keys { display: flex; } }
.option { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .5rem; font-size: .875rem; cursor: pointer; }
.option small { display: block; margin-top: .125rem; font-size: .75rem; color: var(--muted-foreground); }
.option input { flex: none; width: 1.125rem; height: 1.125rem; margin: 0; accent-color: var(--foreground); }
kbd { font: 500 .6875rem ui-monospace, monospace; padding: .0625rem .375rem; border-radius: 4px; background: var(--muted); color: var(--foreground); }

/* Things the agent shows: a page, a picture or a video, in the conversation and full screen. */
.shown { display: flex; flex-direction: column; gap: .375rem; margin: 0; }
.shown .bar { display: flex; align-items: center; justify-content: space-between; gap: .5rem; min-height: 2.25rem; font-size: .8125rem; font-weight: 500; color: var(--muted-foreground); }
.shown .bar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shown .frame { border-radius: var(--radius); overflow: hidden; background: var(--card); }
.shown img, .shown video, .shown iframe { display: block; width: 100%; height: 16rem; border: 0; object-fit: contain; }
#viewer { margin: 0; padding: 0; width: 100vw; height: 100dvh; max-width: none; max-height: none; border: 0; background: var(--background); color: var(--foreground); }
#viewer[open] { display: flex; flex-direction: column; animation: fade .12s ease-out; }
#viewer .bar { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: calc(.5rem + env(safe-area-inset-top)) max(.75rem, env(safe-area-inset-right)) .5rem max(1rem, env(safe-area-inset-left)); font-weight: 500; }
#viewer .body { flex: 1; min-height: 0; display: grid; padding-bottom: env(safe-area-inset-bottom); }
#viewer .body > * { width: 100%; height: 100%; min-height: 0; border: 0; object-fit: contain; background: var(--card); }

@keyframes blink { 50% { opacity: .35; } }
@keyframes breathe { 50% { opacity: .65; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  /* biome-ignore lint/complexity/noImportantStyles: turning motion off must win over every rule */
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get("t");
const ui = { log: $("log"), scroller: $("scroller"), empty: $("empty"), intro: $("intro"), label: $("label"), dock: $("dock"),
  talk: $("talk"), mute: $("mute"), stop: $("stop"), more: $("more"), menu: $("menu"), viewer: $("viewer"), viewerTitle: $("viewerTitle"), viewerBody: $("viewerBody"), size: $("size"), echo: $("echo") };
const labels = { starting: "Loading voice", listening: "Listening", hearing: "Hearing you", thinking: "Thinking", speaking: "Speaking" };

// The worklet turns microphone audio into 16 kHz 16-bit frames of 20 ms, averaging the samples it drops.
const worklet = `registerProcessor("mic", class extends AudioWorkletProcessor {
  constructor() { super(); this.step = sampleRate / 16000; this.at = 0; this.sum = 0; this.count = 0; this.out = new Int16Array(320); this.n = 0; }
  process([input]) {
    const samples = input[0]; if (!samples) return true;
    for (let i = 0; i < samples.length; i++) {
      this.sum += samples[i]; this.count++; this.at++;
      if (this.at < this.step) continue;
      this.at -= this.step;
      this.out[this.n++] = Math.max(-1, Math.min(1, this.sum / this.count)) * 32767;
      this.sum = 0; this.count = 0;
      if (this.n === this.out.length) { this.port.postMessage(this.out.slice().buffer, []); this.n = 0; }
    }
    return true;
  }
});`;

let socket, output, outputGain, micMeter, outMeter;
// Optimistic: the page acts at once and the connection catches up. Until it is open, what would be sent
// waits in the outbox.
let started = false, connected = false, state = "listening", offlineSince = Date.now(), outbox = [];
// Hands-free keeps the microphone open; hold to talk sends it only while the button is down.
// One button for both ways to talk. It listens from the moment it is touched; letting go within `tapTime`
// was a tap, which turns hands-free on or off, and later ends a held turn.
const tapTime = 280;
let free = false, holding = false, pressedAt = 0, tail, hold;
// Small controls take one row instead of half the screen.
let small = localStorage.getItem("bruv-voice-small") === "1";
// On a phone that cancels echo itself, Chrome treats a microphone with echo cancelling as a call: sound
// started after it plays at the call volume and sound started before at the media volume, so the volume
// buttons changed one or the other. Off, it is always the media volume, and bruv tells its own words from
// the user's as it does in the terminal; with earphones nothing is lost.
const echo = localStorage.getItem("bruv-voice-echo") === "1";
ui.echo.checked = echo;
// Playback. Audio comes in numbered sentences ("parts"); finished audio of the sentence playing is kept, so
// unmuting can start that sentence again.
let rate = 24000, incoming = 0, items = [], nextTime = 0, muted = false, now = 0, reported = 0, pauseLater;
// The call this page shows and the entries it has, so a page that reconnects or reopens gets only what it
// missed, and a new call starts a clean page.
let callId, seen = new Set();
// Set when bruv turned voice off, rather than the connection dropping.
let bye = false;
const spans = new Map();
let partialLine, reply;

const sending = () => free || holding || tail !== undefined;

function send(message) {
  const data = typeof message === "string" || message instanceof ArrayBuffer ? message : JSON.stringify(message);
  if (socket?.readyState === WebSocket.OPEN) return socket.send(data);
  outbox.push(data);
  // About 20 seconds of audio; the oldest audio goes first.
  if (outbox.length > 1000) outbox.splice(outbox.findIndex((item) => item instanceof ArrayBuffer), 1);
}

/** Makes a change to the transcript, keeping it scrolled to the end if it was there. */
function atEnd() {
  const { scrollTop, scrollHeight, clientHeight } = ui.scroller;
  return scrollHeight - scrollTop - clientHeight < 48;
}

function follow(change, always = false) {
  const following = always || atEnd();
  const result = change();
  if (following) ui.scroller.scrollTop = ui.scroller.scrollHeight;
  return result;
}

function add(className, text) {
  return follow(() => {
    ui.empty.hidden = true;
    const line = document.createElement("div");
    line.className = className;
    line.textContent = text;
    ui.log.append(line);
    return line;
  });
}

function alert(text) {
  const line = add("alert", "");
  line.innerHTML = `<svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><span></span>`;
  line.lastChild.textContent = text;
}

function render() {
  // A short drop isn't worth showing.
  const offline = started && !connected && Date.now() - offlineSince > 2000;
  const tone = bye ? "idle" : !started ? "idle" : offline ? "error" : holding ? "hearing" : !free && state === "listening" ? "idle" : state;
  document.body.dataset.tone = tone;
  if (small) document.body.dataset.small = ""; else delete document.body.dataset.small;
  if (holding) document.body.dataset.holding = ""; else delete document.body.dataset.holding;
  ui.label.textContent = bye ? "Voice is off" : !started ? "Not started" : offline ? "Connecting" : muted && items.length ? "Muted"
    : holding ? labels.hearing : state === "listening" && !free ? "Ready" : labels[state] ?? state;
  ui.intro.textContent = free ? "Just talk" : "Hold to talk · tap for hands-free";
  ui.talk.querySelector("use").setAttribute("href", free ? "#i-lines" : "#i-mic");
  ui.talk.setAttribute("aria-label", free ? "Hands-free is on. Tap to turn it off, or hold to talk" : "Hold to talk, or tap for hands-free");
  ui.size.setAttribute("aria-pressed", String(small));
  ui.size.setAttribute("aria-label", small ? "Bigger controls" : "Smaller controls");
  ui.size.querySelector("use").setAttribute("href", small ? "#i-up" : "#i-down");
  ui.mute.disabled = !started;
  ui.mute.setAttribute("aria-pressed", String(muted));
  ui.mute.setAttribute("aria-label", muted ? "Unmute" : "Mute");
  ui.mute.querySelector("use").setAttribute("href", muted ? "#i-volume-x" : "#i-volume");
  ui.stop.disabled = !items.length && state !== "speaking";
}

// Playback.
function schedule(item) {
  const source = output.createBufferSource();
  source.buffer = item.audio;
  source.connect(outputGain);
  nextTime = Math.max(nextTime, output.currentTime + 0.03);
  source.start(nextTime);
  item.at = nextTime;
  item.done = false;
  item.source = source;
  nextTime += item.audio.duration;
  source.onended = () => { item.done = true; item.source = undefined; tidy(); };
}

function silence() {
  for (const item of items) if (item.source) { item.source.onended = null; try { item.source.stop(); } catch {} item.source = undefined; }
  nextTime = 0;
}

function tidy() {
  const first = items.find((item) => !item.done);
  if (first) {
    items = items.filter((item) => !item.done || item.part === first.part);
    played(first.part - 1);
    return render();
  }
  const last = Math.max(now, ...items.map((item) => item.part));
  mark(last, true);
  items = [];
  played(last);
  render();
}

/** Tells bruv every sentence up to `part` has been heard. */
function played(part) {
  if (part <= reported) return;
  reported = part;
  send({ type: "played", part });
}

function play(buffer) {
  // A page that hasn't started can't play yet, and bruv doesn't wait for it.
  if (!output) return;
  const pcm = new Int16Array(buffer);
  const audio = output.createBuffer(1, pcm.length, rate);
  const channel = audio.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) channel[i] = pcm[i] / 32768;
  const item = { part: incoming, audio, done: false };
  items.push(item);
  if (!muted) schedule(item);
  render();
}

function setMuted(value) {
  if (!started || value === muted) return;
  muted = value;
  if (muted) silence();
  else {
    // Start again from the beginning of the sentence that was playing.
    const first = items.find((item) => !item.done);
    items = first ? items.filter((item) => item.part >= first.part) : [];
    for (const item of items) schedule(item);
    if (!first) tidy();
  }
  render();
}

/** Someone may be talking over the reply. Only the microphone hearing something turns it down, as it may be
 * the reply's own echo; a press stops it, unless it turns out to be a tap. */
function pause(soft) {
  if (!output) return;
  outputGain.gain.setTargetAtTime(0.15, output.currentTime, 0.03);
  // A press already let go of as a tap (the pause comes later over a slow link) only turned hands-free on.
  if (soft || (!holding && tail === undefined)) return;
  const left = tapTime - (performance.now() - pressedAt);
  clearTimeout(pauseLater);
  if (holding && left > 0) pauseLater = setTimeout(() => { if (holding || tail !== undefined) output.suspend(); }, left);
  else output.suspend();
}

function resume() {
  if (!output) return;
  clearTimeout(pauseLater);
  outputGain.gain.setTargetAtTime(1, output.currentTime, 0.03);
  output.resume();
}

function flush() {
  clearTimeout(pauseLater);
  if (outputGain) outputGain.gain.setTargetAtTime(1, output.currentTime, 0.03);
  silence();
  items = [];
  for (const [part, span] of spans) if (part > now || !span.classList.contains("said")) span.classList.add("cut");
  mark(now, true);
  spans.clear();
  output?.resume();
  render();
}

/** Lights up the sentence being heard and those before it. */
function mark(part, finished = false) {
  now = part;
  for (const [id, span] of spans) {
    span.classList.toggle("now", id === part && !finished);
    if (id <= part) span.classList.add("said");
    if (id < part) spans.delete(id);
  }
}

// Levels for the ring around the button.
function meter(context, node) {
  const analyser = context.createAnalyser();
  analyser.fftSize = 512;
  node.connect(analyser);
  const data = new Float32Array(analyser.fftSize);
  return () => { analyser.getFloatTimeDomainData(data); let sum = 0; for (const x of data) sum += x * x; return Math.sqrt(sum / data.length); };
}

let level = 0;
function frame() {
  requestAnimationFrame(frame);
  if (!started) return;
  const playing = items.find((item) => !item.done && item.source && item.at <= output.currentTime);
  if (playing && playing.part !== now) mark(playing.part);
  const listeningLevel = sending() && micMeter ? micMeter() * 4 : 0;
  const target = Math.min(1, Math.max(listeningLevel, outMeter() * 3));
  level += (target - level) * (target > level ? .5 : .12);
  ui.dock.style.setProperty("--level", level.toFixed(3));
}

// Talking.
function press() {
  if (!started || holding) return;
  holding = true;
  pressedAt = performance.now();
  navigator.vibrate?.(8);
  // Pressing again just after letting go carries on the same turn.
  if (tail !== undefined) { clearTimeout(tail); tail = undefined; }
  // Hands-free already sends everything, so a press only becomes a turn once it outlasts a tap. A tap that
  // turns hands-free off then leaves a reply playing; the words since the press are kept.
  else if (free) hold = setTimeout(() => { hold = undefined; send({ type: "talk", on: true, keep: true }); }, tapTime);
  else send({ type: "talk", on: true });
  render();
}

function release() {
  if (!holding) return;
  holding = false;
  if (performance.now() - pressedAt < tapTime) {
    // A tap. Turning hands-free on hands the turn to silence detection, so words said right away are kept;
    // turning it off ends the turn now.
    free = !free;
    if (hold !== undefined) { clearTimeout(hold); hold = undefined; }
    send({ type: "talk", on: false, keep: free });
    return render();
  }
  // The last word often ends just after the finger lifts.
  tail = setTimeout(() => { tail = undefined; send({ type: "talk", on: false }); render(); }, 300);
  render();
}

function onEvent(event) {
  if (event.seq !== undefined) {
    if (seen.has(event.seq)) return;
    seen.add(event.seq);
  }
  switch (event.type) {
    case "state":
      state = event.state;
      // Words heard that were only echo or noise never become a line.
      if (state !== "hearing") { partialLine?.remove(); partialLine = undefined; }
      return render();
    case "rate": rate = event.rate; return;
    case "part": incoming = event.part; return;
    case "pause": return pause(event.soft);
    case "resume": return resume();
    case "history": {
      if (event.reset) {
        flush();
        for (const element of [...ui.log.children]) if (element !== ui.empty) element.remove();
        ui.empty.hidden = false;
        seen = new Set();
        reply = undefined;
        partialLine = undefined;
        reported = 0;
      }
      callId = event.id;
      for (const entry of event.events) onEvent(entry);
      return;
    }
    case "flush": return flush();
    case "partial":
      // Your own words bring the conversation back to the end, wherever you had scrolled.
      partialLine ??= follow(() => add("msg user partial", ""), true);
      return follow(() => { partialLine.textContent = event.text; });
    case "user":
      // The words being heard become the final line in place, so nothing jumps.
      if (partialLine) follow(() => { partialLine.textContent = event.text; partialLine.classList.remove("partial"); }, true);
      else follow(() => add("msg user", event.text), true);
      partialLine = undefined;
      reply = undefined;
      // Talking to it means you want to hear the answer.
      setMuted(false);
      return;
    case "assistant": {
      reply ??= add("msg assistant", "");
      const span = document.createElement("span");
      span.textContent = `${event.text} `;
      follow(() => reply.append(span));
      if (event.past) span.classList.add("said");
      else spans.set(event.part, span);
      return;
    }
    case "show": return show(event);
    case "note": {
      const line = add(`note ${event.kind}`, event.text);
      if (event.kind === "text") line.addEventListener("click", () => line.classList.toggle("open"));
      // What it says next starts a new block below the work.
      reply = undefined;
      return;
    }
    case "remote":
      for (const phone of document.querySelectorAll(".phone")) {
        phone.hidden = !event.url;
        phone.querySelector(".code").innerHTML = event.qr ?? "";
      }
      return;
    case "error": return alert(event.message);
  }
}

// Shown pages report their height, so they take the room they need.
const sizer = `<script>{const post=()=>parent.postMessage({bruvHeight:Math.ceil(document.documentElement.getBoundingClientRect().height)},"*");addEventListener("load",post);new ResizeObserver(post).observe(document.documentElement);}</` + "script>";

/**
 * Shown things start in a fixed box and take their own height only while nothing is below them, so
 * they never push the conversation around.
 */
function fit(element, height) {
  if (element.closest(".shown") !== ui.log.lastElementChild) return;
  // At most what fits on screen with its title bar, so the whole thing can be seen at once.
  const room = ui.scroller.clientHeight - 56;
  follow(() => { element.style.height = `${Math.round(Math.min(Math.max(height, 48), room))}px`; });
}

function media(item, full) {
  if (item.kind === "image") {
    const image = new Image();
    image.onload = () => fit(image, image.clientWidth * (image.naturalHeight / image.naturalWidth));
    image.src = item.src;
    image.alt = item.title ?? "";
    image.referrerPolicy = "no-referrer";
    return image;
  }
  if (item.kind === "video") {
    const video = document.createElement("video");
    video.src = item.src;
    video.controls = true;
    video.playsInline = true;
    video.preload = "metadata";
    video.onloadedmetadata = () => fit(video, video.clientWidth * (video.videoHeight / video.videoWidth));
    return video;
  }
  // Scripts run, but in a sandbox apart from this page: no key, socket or storage.
  const frame = document.createElement("iframe");
  frame.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox");
  frame.referrerPolicy = "no-referrer";
  frame.title = item.title ?? "Shown page";
  frame.srcdoc = full ? item.html : item.html + sizer;
  return frame;
}

function show(item) {
  follow(() => {
    ui.empty.hidden = true;
    const figure = document.createElement("figure");
    figure.className = "shown";
    figure.innerHTML = `<div class="bar"><span></span><button class="ghost" type="button" aria-label="Full screen"><svg class="icon" aria-hidden="true"><use href="#i-expand"/></svg></button></div><div class="frame"></div>`;
    figure.querySelector("span").textContent = item.title ?? "";
    figure.querySelector(".frame").append(media(item, false));
    figure.querySelector("button").addEventListener("click", () => {
      figure.querySelector("video")?.pause();
      ui.viewerTitle.textContent = item.title ?? "";
      ui.viewerBody.replaceChildren(media(item, true));
      ui.viewer.dataset.atEnd = String(atEnd());
      ui.viewer.showModal();
    });
    ui.log.append(figure);
  });
  // What is said next goes below it, so the picture doesn't move.
  reply = undefined;
}

addEventListener("message", (event) => {
  const height = event.data?.bruvHeight;
  if (typeof height !== "number") return;
  for (const frame of ui.log.querySelectorAll(".shown iframe")) {
    if (frame.contentWindow === event.source) fit(frame, height);
  }
});

function connect(delay = 500) {
  socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/socket?t=${encodeURIComponent(token)}`);
  socket.binaryType = "arraybuffer";
  socket.onmessage = (message) => typeof message.data === "string" ? onEvent(JSON.parse(message.data)) : play(message.data);
  socket.onopen = () => {
    delay = 500;
    connected = true;
    bye = false;
    send({ type: "hello", id: callId, seq: Math.max(0, ...seen) });
    if (started) socket.send(JSON.stringify({ type: "mic" }));
    for (const data of outbox.splice(0)) socket.send(data);
    render();
  };
  socket.onclose = (event) => {
    if (connected) offlineSince = Date.now();
    connected = false;
    // bruv turned voice off; a dropped connection keeps playing what came, and picks up where it was.
    if (event.code === 4000) { bye = true; flush(); }
    // A turn held through the drop goes on over the new connection.
    if (holding || tail !== undefined) outbox.push(JSON.stringify({ type: "talk", on: true }));
    setTimeout(render, 2100);
    setTimeout(() => connect(Math.min(delay * 2, 4000)), delay);
  };
}

async function keepAwake() {
  // Keeps the phone awake while the page is open; the browser lets go of it when the page is hidden.
  if (document.visibilityState === "visible" && started) await navigator.wakeLock?.request("screen").catch(() => undefined);
}

let input;

/** Starts at once from a tap: the button reacts now; the microphone and the connection catch up. */
function begin() {
  if (started) return;
  started = true;
  // Both are made inside the tap, so browsers let them run.
  input ??= new AudioContext();
  if (!output) {
    output = new AudioContext();
    outputGain = output.createGain();
    outputGain.connect(output.destination);
    outMeter = meter(output, outputGain);
  }
  send({ type: "mic" });
  keepAwake();
  render();
  openMic().catch((error) => {
    started = false; holding = false; free = false; clearTimeout(tail); tail = undefined;
    alert(`Microphone: ${error.message}`);
    render();
  });
}

async function openMic() {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: echo, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
  });
  await input.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet], { type: "text/javascript" })));
  const mic = new AudioWorkletNode(input, "mic");
  mic.port.onmessage = (message) => { if (sending()) send(message.data); };
  const source = input.createMediaStreamSource(stream);
  source.connect(mic);
  micMeter = meter(input, source);
  input.resume();
}

/** The talk button or Space went down. The first press also starts the page. */
function down() {
  begin();
  press();
}

ui.talk.addEventListener("pointerdown", (event) => {
  ui.talk.setPointerCapture(event.pointerId);
  down();
});
for (const name of ["pointerup", "pointercancel", "lostpointercapture"]) ui.talk.addEventListener(name, release);
ui.talk.addEventListener("contextmenu", (event) => event.preventDefault());
ui.mute.addEventListener("click", () => setMuted(!muted));
ui.echo.addEventListener("change", () => {
  localStorage.setItem("bruv-voice-echo", ui.echo.checked ? "1" : "0");
  // The volume is chosen when sound and microphone start, so both start again.
  if (started) location.reload();
});
ui.stop.addEventListener("click", () => { flush(); send({ type: "hush" }); });
ui.size.addEventListener("click", () => {
  follow(() => {
    small = !small;
    localStorage.setItem("bruv-voice-small", small ? "1" : "0");
    render();
  });
});
$("close").addEventListener("click", () => ui.viewer.close());
ui.viewer.addEventListener("close", () => {
  ui.viewerBody.replaceChildren();
  // Closing gives focus back to the button, which scrolls to it; go back to following the talk.
  if (ui.viewer.dataset.atEnd === "true") requestAnimationFrame(() => { ui.scroller.scrollTop = ui.scroller.scrollHeight; });
});
ui.more.addEventListener("click", () => { ui.menu.showModal(); ui.more.setAttribute("aria-expanded", "true"); });
ui.menu.addEventListener("close", () => ui.more.setAttribute("aria-expanded", "false"));
// A click on the backdrop closes the menu.
ui.menu.addEventListener("click", (event) => {
  const box = ui.menu.getBoundingClientRect();
  if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) ui.menu.close();
});
addEventListener("keydown", (event) => {
  if (ui.menu.open || ui.viewer.open || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
  if (event.code === "Space" && (event.target === document.body || event.target === ui.talk)) { event.preventDefault(); down(); }
  else if (event.code === "KeyM") setMuted(!muted);
  else if (event.code === "Escape" && !ui.stop.disabled) ui.stop.click();
});
addEventListener("keyup", (event) => { if (event.code === "Space") { event.preventDefault(); release(); } });
document.addEventListener("visibilitychange", keepAwake);
if (!window.isSecureContext) alert("Browsers only allow the microphone on https:// or localhost. Use /voice tunnel, or another https tunnel.");
// Installable as an app; the worker only shows a waiting page when bruv isn't running.
navigator.serviceWorker?.register("sw.js").catch(() => undefined);
connect();
render();
requestAnimationFrame(frame);
</script>
</body>
</html>
