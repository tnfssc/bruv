<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content"><title>Bruv terminal</title><link rel="icon" type="image/svg+xml" href="__BRUV_ICON__"><link rel="stylesheet" href="/terminal.css"><script type="module" src="/terminal.js"></script></head>
<body>
  <div class="workspace-layout">
    <button type="button" id="drawer-backdrop" aria-label="Close workspaces" hidden></button>
    <aside id="workspace-sidebar" aria-label="Workspaces">
      <div class="brand-row"><span class="brand"><!-- BRUV_WORDMARK --></span><button type="button" class="icon-button drawer-close" id="close-drawer" aria-label="Close workspaces">×</button></div>
      <div class="sidebar-heading"><span>Workspaces</span><button type="button" class="icon-button" id="add-workspace" aria-label="Add workspace" title="Add workspace">+</button><button type="button" class="icon-button" id="workspace-menu-toggle" aria-label="Workspace actions" aria-haspopup="menu" aria-expanded="false" aria-controls="workspace-menu"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="currentColor" stroke="none"><circle cx="4" cy="10" r="1.25"/><circle cx="10" cy="10" r="1.25"/><circle cx="16" cy="10" r="1.25"/></g></svg></button></div>
      <nav id="workspace-list" aria-label="Choose workspace"></nav>
    </aside>
    <main class="terminal-area">
      <div class="tab-bar">
        <button type="button" class="icon-button" id="open-drawer" aria-label="Open workspaces" aria-expanded="false" aria-controls="workspace-sidebar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14v12H3zM8 4v12"/></svg></button>
        <div id="tab-list" role="tablist" aria-label="Terminal tabs"></div>
        <button type="button" class="icon-button" id="new-tab" aria-label="New tab" title="New tab">+</button>
        <button type="button" class="icon-button" id="tab-menu-toggle" aria-label="Tab actions" aria-haspopup="menu" aria-expanded="false" aria-controls="tab-menu"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="currentColor" stroke="none"><circle cx="4" cy="10" r="1.25"/><circle cx="10" cy="10" r="1.25"/><circle cx="16" cy="10" r="1.25"/></g></svg></button>
        <div class="terminal-controls">
          <button type="button" class="connection" aria-label="Terminal connection"><span class="connection-dot" aria-hidden="true"></span><span id="status" class="tooltip" role="status">Starting terminal…</span></button>
          <button type="button" class="voice-control" hidden aria-label="Voice status"><span class="mic-label">Voice</span><span id="audio-status" class="tooltip" role="status">Voice off</span></button>
        </div>
      </div>
      <div id="sync-status" role="status"></div>
      <div id="notice" role="alert"></div>
      <div id="terminal-status" role="status" hidden></div>
      <div id="terminal"><div id="empty-terminal"><span class="empty-mark" aria-hidden="true">›_</span><h1>Your terminal, together.</h1><p>Add a workspace to get started.</p><button type="button" id="empty-action" class="primary-button">Add workspace</button></div></div>
    </main>
  </div>
  <div id="workspace-menu" class="context-menu" role="menu" aria-label="Workspace actions" hidden><button type="button" id="reload-workspaces" role="menuitem">Reload workspaces</button><button type="button" id="remove-workspace" role="menuitem" class="danger">Remove workspace…</button></div>
  <div id="tab-menu" class="context-menu" role="menu" aria-label="Tab actions" hidden><button type="button" id="rename-tab" role="menuitem">Rename tab…</button><button type="button" id="close-tab" role="menuitem" class="danger">Close tab…</button></div>
  <dialog id="workspace-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"><form id="dialog-form"><h2 id="dialog-title">Workspace</h2><p id="dialog-description"></p><div id="dialog-field"><label id="dialog-label" for="dialog-input">Name</label><input id="dialog-input" autocomplete="off" required></div><div class="dialog-actions"><button type="button" id="dialog-cancel">Cancel</button><button type="submit" id="dialog-submit" class="primary-button">Save</button></div></form></dialog>
</body>
</html>
